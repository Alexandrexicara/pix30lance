<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05080a">
  <title>PIX30 • Painel Administrativo</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="topbar">
    <div class="container nav">
      <a class="logo" href="index.html"><span>PIX</span><b>30</b></a>
      <nav>
        <a href="index.html">Voltar ao site</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <div><p class="eyebrow">ADMINISTRAÇÃO</p><h2>Painel Administrativo</h2></div>
        </div>

        <!-- Criar Novo Leilão -->
        <div class="admin-section">
          <h3>Criar Novo Leilão</h3>
          <form id="createAuctionForm">
            <label>Nome do produto
              <input type="text" id="auctionName" required placeholder="Ex: iPhone 15 Pro">
            </label>
            <label>Descrição
              <textarea id="auctionDesc" required placeholder="Descrição detalhada do produto"></textarea>
            </label>
            <label>Foto 1 (principal)
              <input type="file" id="auctionPhotoFile" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp">
              <small>Ou cole a URL abaixo</small>
            </label>
            <label>URL da foto 1 (opcional)
              <input type="url" id="auctionPhoto" placeholder="https://...">
            </label>
            <label>Foto 2 (opcional)
              <input type="file" id="auctionPhoto2File" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp">
              <small>Ou cole a URL abaixo</small>
            </label>
            <label>URL da foto 2 (opcional)
              <input type="url" id="auctionPhoto2" placeholder="https://...">
            </label>
            <label>Foto 3 (opcional)
              <input type="file" id="auctionPhoto3File" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp">
              <small>Ou cole a URL abaixo</small>
            </label>
            <label>URL da foto 3 (opcional)
              <input type="url" id="auctionPhoto3" placeholder="https://...">
            </label>
            <label>Foto 4 (opcional)
              <input type="file" id="auctionPhoto4File" accept="image/jpeg,image/jpg,imagepng,image/gif,image/webp">
              <small>Ou cole a URL abaixo</small>
            </label>
            <label>URL da foto 4 (opcional)
              <input type="url" id="auctionPhoto4" placeholder="https://...">
            </label>
            <label>Foto 5 (opcional)
              <input type="file" id="auctionPhoto5File" accept="image/jpeg,image/jpg,image/png,image/gif,image/webp">
              <small>Ou cole a URL abaixo</small>
            </label>
            <label>URL da foto 5 (opcional)
              <input type="url" id="auctionPhoto5" placeholder="https://...">
            </label>
            <label>Valor meta (R$)
              <input type="number" step="0.01" min="0.01" id="auctionMeta" required placeholder="Ex: 5000.00">
            </label>
            <label>Data de início
              <input type="datetime-local" id="auctionStart" required>
            </label>
            <button type="submit" class="btn primary">Criar leilão</button>
          </form>
        </div>

        <!-- Lista de Leilões -->
        <div class="admin-section">
          <h3>Leilões Cadastrados</h3>
          <div id="adminAuctions">
            <p class="loading">Carregando leilões...</p>
          </div>
        </div>

        <!-- Lances Recentes -->
        <div class="admin-section">
          <h3>Todos os Lances</h3>
          <div class="quick-actions">
            <button class="btn ghost" onclick="loadAdminAuctions()">Atualizar lista</button>
            <button class="btn ghost" onclick="showAllBids()">Ver todos os lances</button>
          </div>
          <div id="allBidsContainer">
            <p class="loading">Carregando lances...</p>
          </div>
        </div>

        <!-- Notificações de Vencedores -->
        <div class="admin-section">
          <h3>Notificações de Vencedores</h3>
          <div class="quick-actions">
            <button class="btn ghost" onclick="loadWinnerNotifications()">Carregar notificações</button>
          </div>
          <div id="notificationsContainer">
            <p class="loading">Carregando notificações...</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer><div class="container footer"><div class="logo"><span>PIX</span><b>30</b></div><p>© 2026 PIX30 • Painel Administrativo</p></div></footer>

  <script>
    const API_BASE = '/api';

    // Load admin auctions
    async function loadAdminAuctions() {
      try {
        const response = await fetch(`${API_BASE}/admin/leiloes`);
        const auctions = await response.json();
        if (!response.ok) throw new Error(auctions.error || `HTTP ${response.status}`);
        
        const el = document.getElementById('adminAuctions');
        if (auctions.length === 0) {
          el.innerHTML = '<p class="no-auctions">Nenhum leilão cadastrado.</p>';
          return;
        }
        
        el.innerHTML = auctions.map(a => `
          <div class="admin-auction-item">
            <div class="admin-auction-header">
              <strong>${a.nome}</strong>
              <span class="status ${a.status}">${a.status}</span>
            </div>
            <div class="admin-auction-details">
              <p>Meta: ${a.valor_meta.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</p>
              <p>Arrecadado: ${a.arrecadado_real?.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) || 'R$ 0,00'}</p>
              <p>Participantes: ${a.participantes || 0}</p>
              <p>Início: ${new Date(a.data_inicio).toLocaleString('pt-BR')}</p>
              <p>Fim: ${new Date(a.data_fim).toLocaleString('pt-BR')}</p>
              ${a.status === 'ativo' && new Date(a.data_fim) < new Date() ? `
                <button class="btn primary" onclick="calculateWinner('${a.id}')">Calcular Vencedor</button>
              ` : ''}
              ${a.valor_vencedor ? `
                <p class="winner-info">Vencedor: lance de ${a.valor_vencedor.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'})}</p>
                <p class="meta-info">Meta atingida: ${a.meta_atingida ? 'Sim' : 'Não (70% do arrecadado)'}</p>
              ` : ''}
              <div class="admin-actions">
                <button class="btn ghost" onclick="renewAuction('${a.id}')">🔄 Renovar (+30 dias)</button>
                <button class="btn ghost" onclick="deleteAuction('${a.id}')" style="color: #ff6d6d; border-color: #ff6d6d;">🗑️ Apagar</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (error) {
        console.error('Erro ao carregar leilões:', error);
        document.getElementById('adminAuctions').innerHTML = '<p class="error">Erro ao carregar leilões.</p>';
      }
    }

    // Create new auction
    async function createAuction(e) {
      e.preventDefault();
      
      const nome = document.getElementById('auctionName').value;
      const descricao = document.getElementById('auctionDesc').value;
      const fotoFile = document.getElementById('auctionPhotoFile').files[0];
      const foto_url = document.getElementById('auctionPhoto').value;
      const fotoFile2 = document.getElementById('auctionPhoto2File').files[0];
      const foto_url_2 = document.getElementById('auctionPhoto2').value;
      const fotoFile3 = document.getElementById('auctionPhoto3File').files[0];
      const foto_url_3 = document.getElementById('auctionPhoto3').value;
      const fotoFile4 = document.getElementById('auctionPhoto4File').files[0];
      const foto_url_4 = document.getElementById('auctionPhoto4').value;
      const fotoFile5 = document.getElementById('auctionPhoto5File').files[0];
      const foto_url_5 = document.getElementById('auctionPhoto5').value;
      const valor_meta = parseFloat(document.getElementById('auctionMeta').value);
      const data_inicio = document.getElementById('auctionStart').value;
      
      let finalFotoUrl = foto_url;
      let finalFotoUrl2 = foto_url_2;
      let finalFotoUrl3 = foto_url_3;
      let finalFotoUrl4 = foto_url_4;
      let finalFotoUrl5 = foto_url_5;
      const submitBtn = document.querySelector('#createAuctionForm button[type="submit"]');
      const originalBtnText = submitBtn.textContent;

      submitBtn.textContent = 'Aguarde, criando leilão...';
      submitBtn.disabled = true;
      
      try {
        const uploadPhoto = async (file) => {
          const formData = new FormData();
          formData.append('foto', file);
          const uploadResponse = await fetch(`${API_BASE}/upload`, { method: 'POST', body: formData });
          const uploadResult = await uploadResponse.json();
          if (!uploadResponse.ok || !uploadResult.success || !uploadResult.fotoUrl) {
            throw new Error(uploadResult.error || `Falha no upload (HTTP ${uploadResponse.status})`);
          }
          return uploadResult.fotoUrl;
        };

        // Upload photos if files are selected
        if (fotoFile) {
          finalFotoUrl = await uploadPhoto(fotoFile);
        }
        if (fotoFile2) {
          finalFotoUrl2 = await uploadPhoto(fotoFile2);
        }
        if (fotoFile3) {
          finalFotoUrl3 = await uploadPhoto(fotoFile3);
        }
        if (fotoFile4) {
          finalFotoUrl4 = await uploadPhoto(fotoFile4);
        }
        if (fotoFile5) {
          finalFotoUrl5 = await uploadPhoto(fotoFile5);
        }
        
        // Show loading message
        const response = await fetch(`${API_BASE}/leiloes`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, descricao, foto_url: finalFotoUrl, foto_url_2: finalFotoUrl2, foto_url_3: finalFotoUrl3, foto_url_4: finalFotoUrl4, foto_url_5: finalFotoUrl5, valor_meta, data_inicio })
        });
        
        const result = await response.json();
        if (!response.ok || result.error) throw new Error(result.error || `Falha ao criar leilão (HTTP ${response.status})`);
        
        alert('✅ Leilão criado com sucesso!');
        document.getElementById('createAuctionForm').reset();
        loadAdminAuctions();
      } catch (error) {
        console.error('Erro ao criar leilão:', error);
        alert(error.message || 'Erro ao criar leilão. Tente novamente.');
      } finally {
        submitBtn.textContent = originalBtnText;
        submitBtn.disabled = false;
      }
    }

    // Calculate winner
    async function calculateWinner(auctionId) {
      if (!confirm('Deseja calcular o vencedor deste leilão? Esta ação encerrará o leilão.')) {
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/leiloes/${auctionId}/calcular-vencedor`, {
          method: 'POST'
        });
        
        const result = await response.json();
        
        if (result.error) {
          alert(result.error);
          return;
        }
        
        alert(`✓ Vencedor calculado!\n\nValor do lance vencedor: ${result.valor_vencedor?.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) || 'Nenhum'}\nValor final: ${result.valor_final?.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) || 'N/A'}\nMeta atingida: ${result.meta_atingida ? 'Sim' : 'Não'}`);
        loadAdminAuctions();
      } catch (error) {
        console.error('Erro ao calcular vencedor:', error);
        alert('Erro ao calcular vencedor. Tente novamente.');
      }
    }

    // Show all bids
    async function showAllBids() {
      try {
        const response = await fetch(`${API_BASE}/admin/lances`);
        const bids = await response.json();

        const container = document.getElementById('allBidsContainer');

        if (bids.length === 0) {
          container.innerHTML = '<p class="no-auctions">Nenhum lance encontrado.</p>';
          return;
        }

        container.innerHTML = `
          <table class="bids-table">
            <thead>
              <tr>
                <th>Usuário</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>CPF/CNPJ</th>
                <th>Leilão</th>
                <th>Valor</th>
                <th>Status</th>
                <th>Data</th>
              </tr>
            </thead>
            <tbody>
              ${bids.map(bid => `
                <tr>
                  <td>${bid.usuario_nome}</td>
                  <td>${bid.usuario_email}</td>
                  <td>${bid.usuario_telefone || '-'}</td>
                  <td>${bid.usuario_cpf_cnpj || '-'}</td>
                  <td>${bid.leilao_nome}</td>
                  <td>R$ ${bid.valor?.toFixed(2) || 'N/A'}</td>
                  <td><span class="status ${bid.status_pix}">${bid.status_pix}</span></td>
                  <td>${new Date(bid.criado_em).toLocaleString('pt-BR')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
          <p class="total-bids">Total: ${bids.length} lances</p>
        `;
      } catch (error) {
        console.error('Erro ao carregar lances:', error);
        document.getElementById('allBidsContainer').innerHTML = '<p class="error">Erro ao carregar lances. Tente novamente.</p>';
      }
    }

    // Renew auction
    async function renewAuction(auctionId) {
      if (!confirm('Deseja renovar este leilão por mais 30 dias?')) {
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/admin/leiloes/${auctionId}/renovar`, {
          method: 'POST'
        });
        
        const result = await response.json();
        
        if (result.error) {
          alert(result.error);
          return;
        }
        
        alert('✓ Leilão renovado com sucesso! Data final estendida em 30 dias.');
        loadAdminAuctions();
      } catch (error) {
        console.error('Erro ao renovar leilão:', error);
        alert('Erro ao renovar leilão. Tente novamente.');
      }
    }

    // Delete auction
    async function deleteAuction(auctionId) {
      if (!confirm('Tem certeza que deseja apagar este leilão? Esta ação não pode ser desfeita e apagará todos os lances relacionados.')) {
        return;
      }
      
      try {
        const response = await fetch(`${API_BASE}/admin/leiloes/${auctionId}`, {
          method: 'DELETE'
        });
        
        const result = await response.json();
        
        if (result.error) {
          alert(result.error);
          return;
        }
        
        alert('✓ Leilão apagado com sucesso!');
        loadAdminAuctions();
      } catch (error) {
        console.error('Erro ao apagar leilão:', error);
        alert('Erro ao apagar leilão. Tente novamente.');
      }
    }

    // Load winner notifications
    async function loadWinnerNotifications() {
      try {
        const response = await fetch(`${API_BASE}/admin/notificacoes-vencedores`);
        const notifications = await response.json();

        const container = document.getElementById('notificationsContainer');

        if (notifications.length === 0) {
          container.innerHTML = '<p class="no-auctions">Nenhuma notificação de vencedor encontrada.</p>';
          return;
        }

        container.innerHTML = notifications.map(n => {
          const details = typeof n.detalhes === 'string' ? JSON.parse(n.detalhes) : n.detalhes;

          return `
            <div class="notification-item">
              <div class="notification-header">
                <strong>🏆 ${details.winner} venceu o leilão "${n.leilao_nome}"</strong>
                <span class="notification-date">${new Date(n.criado_em).toLocaleString('pt-BR')}</span>
              </div>
              <div class="notification-details">
                <p>Lance vencedor: R$ ${n.lance_valor?.toFixed(2) || 'N/A'}</p>
                <p>Prêmio: ${details.prizeInfo || 'N/A'}</p>
                <div class="notification-actions">
                  <a href="${details.winnerWhatsAppLink}" target="_blank" class="btn primary small">Enviar WhatsApp para Vencedor</a>
                  <a href="${details.adminWhatsAppLink}" target="_blank" class="btn ghost small">Abrir WhatsApp Admin</a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (error) {
        console.error('Erro ao carregar notificações:', error);
        document.getElementById('notificationsContainer').innerHTML = '<p class="error">Erro ao carregar notificações. Tente novamente.</p>';
      }
    }

    // Set default start date to now
    document.getElementById('auctionStart').value = new Date().toISOString().slice(0, 16);

    // Event listeners
    document.getElementById('createAuctionForm').onsubmit = createAuction;

    // Initialize
    loadAdminAuctions();
    showAllBids();
    loadWinnerNotifications();
  </script>
</body>
</html>
